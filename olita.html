<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta Especial</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden; /* Evita barras de desplazamiento al moverse el botón */
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 85%;
            width: 320px;
            position: relative;
            z-index: 10;
        }
        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
            transition: transform 0.1s ease;
        }
        button:first-child {
            background: #2ed573;
            box-shadow: 0 4px 10px rgba(46, 213, 115, 0.3);
        }
        #btnNo {
            position: relative;
            transition: all 0.1s ease;
        }
        button:active {
            transform: scale(0.95);
        }
        #mensajeFinal {
            font-size: 20px;
            font-weight: bold;
            color: #2f3542;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="pregunta">ola (con intencion reproductiva) queres ser mi novia?</h2>
        <div class="btn-container" id="botones">
            <button onclick="mostrarRespuesta('jejeje te amo pesiosa')">Sí</button>
            <button id="btnNo" ontouchstart="moverBoton()" onmouseover="moverBoton()" onclick="moverBoton()">No</button>
        </div>
        <div id="mensajeFinal"></div>
    </div>

    <script>
        function mostrarRespuesta(texto) {
            document.getElementById('pregunta').style.display = 'none';
            document.getElementById('botones').style.display = 'none';
            document.getElementById('mensajeFinal').innerText = texto;
        }

        function moverBoton() {
            const btnNo = document.getElementById('btnNo');
            // Calcula una posición aleatoria dentro de los límites de la pantalla del móvil
            const maxX = window.innerWidth - btnNo.offsetWidth - 40;
            const maxY = window.innerHeight - btnNo.offsetHeight - 40;
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));

            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
